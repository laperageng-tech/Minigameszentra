name: Build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Cek struktur
        run: find src -type f | sort
      - run: mvn -B clean package
      - name: Cek isi jar
        run: unzip -l target/ZentraMinigames.jar | tail -25
      - uses: actions/upload-artifact@v4
        with:
          name: ZentraMinigames
          path: target/ZentraMinigames.jar
