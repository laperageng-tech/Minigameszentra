name: Build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Daftar file di repo
        run: find . -path ./.git -prune -o -type f -print | sort

      - name: Siapkan sumber (pom.xml langsung, atau ekstrak zip)
        run: |
          mkdir -p /tmp/proj /tmp/unz
          POM=$(find . -name pom.xml -not -path "./.git/*" -not -path "*/target/*" | head -n 1)
          if [ -n "$POM" ]; then
            echo "Pakai pom.xml di repo: $POM"
            cp -r "$(dirname "$POM")"/. /tmp/proj/
          else
            ZIP=$(find . -iname "*.zip" -not -path "./.git/*" | head -n 1)
            if [ -z "$ZIP" ]; then
              echo "ERROR: tidak ada pom.xml dan tidak ada file .zip di repo. Upload ZentraMinigames-repo.zip ke repo."
              exit 1
            fi
            echo "Mengekstrak: $ZIP"
            unzip -q -o "$ZIP" -d /tmp/unz
            POM=$(find /tmp/unz -name pom.xml | head -n 1)
            if [ -z "$POM" ]; then
              echo "ERROR: di dalam zip tidak ada pom.xml."
              exit 1
            fi
            cp -r "$(dirname "$POM")"/. /tmp/proj/
          fi
          echo "Isi proyek:"
          find /tmp/proj -type f | sort

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build
        run: mvn -B -f /tmp/proj/pom.xml clean package

      - name: Isi jar
        run: unzip -l /tmp/proj/target/ZentraMinigames.jar | tail -30

      - name: Siapkan hasil
        run: |
          mkdir -p "$GITHUB_WORKSPACE/hasil"
          cp /tmp/proj/target/ZentraMinigames.jar "$GITHUB_WORKSPACE/hasil/"

      - uses: actions/upload-artifact@v4
        with:
          name: ZentraMinigames
          path: hasil/ZentraMinigames.jar
